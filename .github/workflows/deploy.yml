
name: Deploy React Frontend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare EC2 directory
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} \
            "sudo mkdir -p /var/www/html && sudo chown -R ubuntu:ubuntu /var/www/html && mkdir -p /tmp/marketing-frontend"

      - name: Copy build files to EC2
        run: |
          scp -r dist/. ubuntu@${{ secrets.EC2_HOST }}:/tmp/marketing-frontend/

      - name: Publish files to Nginx
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} \
            "sudo rm -rf /var/www/html/* && sudo cp -r /tmp/marketing-frontend/. /var/www/html/ && sudo chown -R www-data:www-data /var/www/html"
